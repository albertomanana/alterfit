<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: content}">
<head>
    <title>Rutinas</title>
</head>
<body>
    <div th:fragment="content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="h4 fw-bold mb-0">Entrenamientos Programados</h2>
                <p class="text-muted small mb-0">Biblioteca de rutinas y asignaciones personalizadas.</p>
            </div>
            <a th:href="@{/rutinas/nueva}" class="ff-btn ff-btn-primary">
                <i class="bi bi-journal-plus me-2"></i> Crear Rutina
            </a>
        </div>

        <div class="row g-4">
            <div th:each="r : ${rutinas}" class="col-12 col-md-6 col-lg-4">
                <div class="ff-hud-card h-100 d-flex flex-column" th:style="${r.activa ? '' : 'opacity: 0.6;'}">
                    <div class="d-flex justify-content-between align-items-start mb-3">
                        <h3 class="h6 fw-bold mb-0" th:text="${r.nombre}">Nombre Rutina</h3>
                        <span th:if="${r.activa}" class="badge bg-success bg-opacity-10 text-success border border-success-subtle">Activa</span>
                        <span th:unless="${r.activa}" class="badge bg-secondary bg-opacity-10 text-secondary border border-secondary-subtle">Inactiva</span>
                    </div>
                    
                    <div class="mb-3">
                        <div class="text-muted small text-uppercase fw-bold" style="font-size: 0.6rem;">Usuario Asignado</div>
                        <div class="fw-bold text-primary" th:text="${r.usuario != null ? r.usuario.nombreCompleto : 'Biblioteca General'}">Usuario</div>
                    </div>

                    <p class="text-muted small flex-grow-1 mb-4" th:text="${r.descripcion}">Descripción...</p>

                    <div class="pt-3 border-top border-secondary-subtle d-flex justify-content-between align-items-center">
                        <div class="small text-muted">
                            <i class="bi bi-person-badge me-1"></i>
                            <span th:text="${r.creador != null ? r.creador.usuario.nombre : 'Sistema'}">Creador</span>
                        </div>
                        <a th:href="@{/rutinas/{id}/editar(id=${r.id})}" class="btn btn-sm btn-outline-secondary border-secondary-subtle text-white">
                            <i class="bi bi-pencil"></i>
                        </a>
                    </div>
                </div>
            </div>
            <div th:if="${#lists.isEmpty(rutinas)}" class="col-12 text-center py-5 ff-hud-card">
                <i class="bi bi-journals fs-1 opacity-25"></i>
                <p class="mt-2 text-muted">No hay rutinas registradas aún.</p>
            </div>
        </div>
    </div>
</body>
</html>
