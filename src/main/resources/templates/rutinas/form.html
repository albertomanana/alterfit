<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: content}">
<head>
    <title>Configurar Rutina</title>
</head>
<body>
    <div th:fragment="content">
        <div class="mb-4">
            <a th:href="@{/rutinas}" class="text-muted text-decoration-none small">
                <i class="bi bi-arrow-left"></i> Volver a biblioteca
            </a>
            <h2 class="h4 fw-bold mt-2">Diseño de Entrenamiento</h2>
        </div>

        <div class="row">
            <div class="col-12 col-lg-8">
                <div class="ff-hud-card">
                    <form th:action="@{/rutinas/guardar}" th:object="${rutina}" method="post">
                        <input type="hidden" th:field="*{id}">
                        
                        <div class="row g-4">
                            <div class="col-12">
                                <label class="form-label text-muted fw-bold small">NOMBRE DE LA RUTINA</label>
                                <input type="text" th:field="*{nombre}" class="form-control bg-transparent border-secondary-subtle text-white p-3" placeholder="Ej: Fuerza Hipertrofia A" required>
                            </div>
                            
                            <div class="col-12">
                                <label class="form-label text-muted fw-bold small">DESCRIPCIÓN / EJERCICIOS</label>
                                <textarea th:field="*{descripcion}" class="form-control bg-transparent border-secondary-subtle text-white" rows="6" placeholder="Detalle los ejercicios, series y repeticiones..."></textarea>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label text-muted fw-bold small">ASIGNAR A USUARIO (OPCIONAL)</label>
                                <select th:field="*{usuario}" class="form-select bg-transparent border-secondary-subtle text-white">
                                    <option value="" class="bg-dark">-- Biblioteca General --</option>
                                    <option th:each="u : ${usuarios}" th:value="${u.id}" th:text="${u.nombreCompleto}" class="bg-dark"></option>
                                </select>
                            </div>
                            
                            <div class="col-md-6">
                                <label class="form-label text-muted fw-bold small">STAFF RESPONSABLE</label>
                                <select th:field="*{creador}" class="form-select bg-transparent border-secondary-subtle text-white">
                                    <option value="" class="bg-dark">-- Seleccionar Staff --</option>
                                    <option th:each="s : ${staffList}" th:value="${s.id}" th:text="${s.usuario.nombre}" class="bg-dark"></option>
                                </select>
                            </div>

                            <div class="col-12 mt-4 pt-3 border-top border-secondary-subtle d-flex justify-content-end gap-3">
                                <a th:href="@{/rutinas}" class="ff-btn btn-outline-secondary border-secondary-subtle text-white">Cancelar</a>
                                <button type="submit" class="ff-btn ff-btn-primary">
                                    <i class="bi bi-save me-2"></i> Guardar Rutina
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

            <div class="col-12 col-lg-4">
                <div class="ff-hud-card h-100">
                    <h3 class="h6 fw-bold mb-4">Panel de Control</h3>
                    <div class="form-check form-switch mb-4">
                        <input class="form-check-input" type="checkbox" role="switch" id="activaSwitch" th:field="*{activa}">
                        <label class="form-check-label text-muted small" for="activaSwitch">Rutina Visible / Activa</label>
                    </div>
                    <div class="p-3 bg-secondary bg-opacity-10 rounded border border-secondary-subtle mb-4">
                        <p class="small mb-0 opacity-75">Las rutinas asignadas a un usuario serán visibles en su panel personal. Las rutinas en la biblioteca general pueden ser clonadas por otros entrenadores.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
