<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:fragment="alerts" class="ff-alerts-container">
    <!-- Success Alert -->
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show ff-hud-card mb-4" role="alert" style="border-left: 4px solid var(--ff-primary); background: rgba(34, 197, 94, 0.1);">
        <div class="d-flex align-items-center gap-2">
            <i class="bi bi-check-circle-fill text-success fs-5"></i>
            <span th:text="${success}">Operación completada con éxito.</span>
        </div>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <!-- Error Alert -->
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show ff-hud-card mb-4" role="alert" style="border-left: 4px solid #ef4444; background: rgba(239, 68, 68, 0.1);">
        <div class="d-flex align-items-center gap-2">
            <i class="bi bi-exclamation-triangle-fill text-danger fs-5"></i>
            <span th:text="${error}">Ha ocurrido un error inesperado.</span>
        </div>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
</div>
</html>
