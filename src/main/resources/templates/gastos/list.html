<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: content}">
<head>
    <title>Gastos</title>
</head>
<body>
    <div th:fragment="content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="h4 fw-bold mb-0">Egresos Operativos</h2>
                <p class="text-muted small mb-0">Seguimiento de costos y facturas.</p>
            </div>
            <a th:href="@{/gastos/nuevo}" class="ff-btn ff-btn-primary">
                <i class="bi bi-plus-circle me-2"></i> Registrar Gasto
            </a>
        </div>

        <div class="ff-hud-card">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0" style="color: var(--ff-text);">
                    <thead class="text-muted text-uppercase fw-bold" style="font-size: 0.75rem;">
                        <tr>
                            <th class="border-secondary-subtle">Concepto</th>
                            <th class="border-secondary-subtle">Monto</th>
                            <th class="border-secondary-subtle">Fecha</th>
                            <th class="border-secondary-subtle">Categoría</th>
                            <th class="border-secondary-subtle">Estado</th>
                            <th class="border-secondary-subtle text-end">Acciones</th>
                        </tr>
                    </thead>
                    <tbody class="border-0">
                        <tr th:each="g : ${gastos}" class="border-secondary-subtle">
                            <td>
                                <div class="fw-bold" th:text="${g.concepto}">Concepto</div>
                            </td>
                            <td class="fw-bold ff-tabular text-danger" th:text="${'-' + g.monto + '€'}">-0€</td>
                            <td class="small text-muted" th:text="${#temporals.format(g.fecha, 'dd/MM/yyyy HH:mm')}">01/01/2026</td>
                            <td>
                                <span class="badge bg-secondary bg-opacity-10 text-secondary border border-secondary-subtle" th:text="${g.categoria}">CAT</span>
                            </td>
                            <td>
                                <span class="badge bg-opacity-10 border" 
                                      th:classappend="${g.estado == 'PAGADO' ? 'bg-success text-success border-success-subtle' : 'bg-warning text-warning border-warning-subtle'}"
                                      th:text="${g.estado}">ESTADO</span>
                            </td>
                            <td class="text-end">
                                <button class="btn btn-sm btn-outline-secondary border-secondary-subtle text-white">
                                    <i class="bi bi-file-earmark-pdf"></i>
                                </button>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(gastos)}">
                            <td colspan="6" class="text-center py-5 text-muted">
                                <i class="bi bi-receipt-cutoff fs-1 opacity-25"></i>
                                <p class="mt-2">No hay gastos registrados.</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
