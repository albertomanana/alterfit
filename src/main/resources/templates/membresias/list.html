<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: content}">
<head>
    <title>Membresías</title>
</head>
<body>
    <div th:fragment="content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="h4 fw-bold mb-0">Contratos de Usuarios</h2>
                <p class="text-muted small mb-0">Vínculos activos entre clientes y planes.</p>
            </div>
            <div class="d-flex gap-2">
                <a th:href="@{/planes}" class="ff-btn ff-btn-hud">
                    <i class="bi bi-tags me-2"></i> Ver Planes
                </a>
                <a th:href="@{/membresias/nuevo}" class="ff-btn ff-btn-primary">
                    <i class="bi bi-file-earmark-plus me-2"></i> Alta Membresía
                </a>
            </div>
        </div>

        <div class="ff-hud-card">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0" style="color: var(--ff-text);">
                    <thead class="text-muted text-uppercase fw-bold" style="font-size: 0.75rem;">
                        <tr>
                            <th class="border-secondary-subtle">Usuario</th>
                            <th class="border-secondary-subtle">Plan Contratado</th>
                            <th class="border-secondary-subtle">Periodo</th>
                            <th class="border-secondary-subtle">Estado</th>
                            <th class="border-secondary-subtle text-end">Acciones</th>
                        </tr>
                    </thead>
                    <tbody class="border-0">
                        <tr th:each="m : ${membresias}" class="border-secondary-subtle">
                            <td>
                                <div class="fw-bold" th:text="${m.usuario.nombreCompleto}">Nombre Usuario</div>
                                <div class="text-muted small" th:text="${m.usuario.email}">email@example.com</div>
                            </td>
                            <td>
                                <div class="fw-bold text-primary" th:text="${m.plan.nombre}">Nombre Plan</div>
                                <div class="text-muted small" th:text="${m.plan.precio + '€'}">0€</div>
                            </td>
                            <td class="small">
                                <span th:text="${#temporals.format(m.fechaInicio, 'dd/MM/yyyy')}">01/01/2026</span>
                                <i class="bi bi-arrow-right mx-1 opacity-50"></i>
                                <span th:text="${#temporals.format(m.fechaFin, 'dd/MM/yyyy')}">01/01/2026</span>
                            </td>
                            <td>
                                <span class="badge bg-opacity-10 border" 
                                      th:classappend="${m.estado.name() == 'ACTIVA' ? 'bg-success text-success border-success-subtle' : 'bg-warning text-warning border-warning-subtle'}"
                                      th:text="${m.estado.display}">ACTIVA</span>
                            </td>
                            <td class="text-end">
                                <a th:href="@{/membresias/{id}(id=${m.id})}" class="btn btn-sm btn-outline-secondary border-secondary-subtle text-white">
                                    <i class="bi bi-eye"></i>
                                </a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(membresias)}">
                            <td colspan="5" class="text-center py-5 text-muted">
                                <i class="bi bi-file-earmark-x fs-1 opacity-25"></i>
                                <p class="mt-2">No hay membresías activas registradas.</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
