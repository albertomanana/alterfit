<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: content}">
<head>
    <title>Alta de Membresía</title>
</head>
<body>
    <div th:fragment="content">
        <div class="mb-4">
            <a th:href="@{/membresias}" class="text-muted text-decoration-none small">
                <i class="bi bi-arrow-left"></i> Volver al listado
            </a>
            <h2 class="h4 fw-bold mt-2">Nueva Contratación</h2>
        </div>

        <div class="row">
            <div class="col-12 col-lg-7">
                <div class="ff-hud-card">
                    <form th:action="@{/membresias/contratar}" th:object="${membresia}" method="post">
                        <div class="mb-4">
                            <label class="form-label text-muted fw-bold small">SELECCIONAR USUARIO</label>
                            <select th:field="*{usuario}" class="form-select bg-transparent border-secondary-subtle text-white p-3" required>
                                <option value="" class="bg-dark">-- Seleccionar Cliente --</option>
                                <option th:each="u : ${usuarios}" th:value="${u.id}" th:text="${u.nombreCompleto + ' (' + u.email + ')'}" class="bg-dark"></option>
                            </select>
                        </div>

                        <div class="mb-4">
                            <label class="form-label text-muted fw-bold small">SELECCIONAR PLAN</label>
                            <div class="row g-3">
                                <div th:each="p : ${planes}" class="col-md-6">
                                    <div class="ff-hud-card p-3 h-100 cursor-pointer plan-option" th:data-plan-id="${p.id}" onclick="selectPlan(this)">
                                        <div class="form-check">
                                            <input class="form-check-input" type="radio" th:value="${p.id}" th:field="*{plan}" th:id="${'plan-' + p.id}" required>
                                            <label class="form-check-label fw-bold d-block" th:for="${'plan-' + p.id}">
                                                <span th:text="${p.nombre}">Nombre Plan</span>
                                                <span class="d-block text-primary h5 mt-1" th:text="${p.precio + '€'}">0€</span>
                                                <small class="text-muted d-block fw-normal" th:text="${p.duracionMeses + ' mes(es)'}">1 mes</small>
                                            </label>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="form-check form-switch mb-4">
                            <input class="form-check-input" type="checkbox" role="switch" id="renovacionSwitch" th:field="*{renovacionAutomatica}">
                            <label class="form-check-label text-muted small" for="renovacionSwitch">Activar renovación automática</label>
                        </div>

                        <div class="mt-4 pt-3 border-top border-secondary-subtle d-flex justify-content-end gap-3">
                            <a th:href="@{/membresias}" class="ff-btn btn-outline-secondary border-secondary-subtle text-white">Cancelar</a>
                            <button type="submit" class="ff-btn ff-btn-primary">
                                <i class="bi bi-shield-check me-2"></i> Confirmar Contratación
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="col-12 col-lg-5">
                <div class="ff-hud-card h-100">
                    <h3 class="h6 fw-bold mb-4">Resumen de Operación</h3>
                    <div class="p-3 bg-secondary bg-opacity-10 rounded border border-secondary-subtle mb-4">
                        <div class="d-flex justify-content-between mb-2">
                            <span class="text-muted small">Fecha de Inicio:</span>
                            <span class="fw-bold small" th:text="${#temporals.format(#temporals.createNow(), 'dd/MM/yyyy')}">Hoy</span>
                        </div>
                        <div class="d-flex justify-content-between mb-2">
                            <span class="text-muted small">Primer Vencimiento:</span>
                            <span class="fw-bold small" th:text="${#temporals.format(#temporals.createNow().plusDays(3), 'dd/MM/yyyy')}">En 3 días</span>
                        </div>
                    </div>
                    <div class="text-center p-4">
                        <i class="bi bi-receipt fs-1 text-muted opacity-25"></i>
                        <p class="small text-muted mt-3">Al confirmar, el sistema generará automáticamente un registro de pago pendiente y activará el acceso del usuario según las reglas del plan seleccionado.</p>
                    </div>
                </div>
            </div>
        </div>

        <script>
            function selectPlan(element) {
                const radio = element.querySelector('input[type="radio"]');
                radio.checked = true;
                document.querySelectorAll('.plan-option').forEach(opt => opt.style.borderColor = 'var(--ff-border)');
                element.style.borderColor = 'var(--ff-primary)';
            }
        </script>
    </div>
</body>
</html>
