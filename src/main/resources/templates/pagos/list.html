<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: content}">
<head>
    <title>Pagos</title>
</head>
<body>
    <div th:fragment="content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="h4 fw-bold mb-0">Gestión Financiera</h2>
                <p class="text-muted small mb-0">Control de ingresos y cuotas pendientes.</p>
            </div>
            <div class="d-flex gap-3">
                <div class="ff-hud-card p-2 px-3 d-flex align-items-center gap-2">
                    <span class="text-muted small fw-bold">TOTAL RECAUDADO:</span>
                    <span class="text-success fw-bold">0.00€</span>
                </div>
            </div>
        </div>

        <div class="ff-hud-card">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0" style="color: var(--ff-text);">
                    <thead class="text-muted text-uppercase fw-bold" style="font-size: 0.75rem;">
                        <tr>
                            <th class="border-secondary-subtle">Referencia</th>
                            <th class="border-secondary-subtle">Cliente</th>
                            <th class="border-secondary-subtle">Monto</th>
                            <th class="border-secondary-subtle">Vencimiento</th>
                            <th class="border-secondary-subtle">Estado</th>
                            <th class="border-secondary-subtle text-end">Acciones</th>
                        </tr>
                    </thead>
                    <tbody class="border-0">
                        <tr th:each="p : ${pagos}" class="border-secondary-subtle">
                            <td>
                                <code class="text-primary fw-bold" th:text="${p.referencia}">REF-000</code>
                            </td>
                            <td>
                                <div class="fw-bold" th:text="${p.usuario.nombreCompleto}">Nombre Cliente</div>
                                <div class="text-muted small" th:text="${p.usuario.email}">email@example.com</div>
                            </td>
                            <td class="fw-bold ff-tabular" th:text="${p.monto + '€'}">0€</td>
                            <td class="small" th:classappend="${p.estado.name() == 'PENDIENTE' && #temporals.createNow().isAfter(p.fechaVencimiento) ? 'text-danger' : 'text-muted'}">
                                <i class="bi bi-calendar-event me-1"></i>
                                <span th:text="${#temporals.format(p.fechaVencimiento, 'dd/MM/yyyy')}">01/01/2026</span>
                            </td>
                            <td>
                                <span class="badge bg-opacity-10 border" 
                                      th:classappend="${p.estado.name() == 'PAGADO' ? 'bg-success text-success border-success-subtle' : (p.estado.name() == 'PENDIENTE' ? 'bg-warning text-warning border-warning-subtle' : 'bg-danger text-danger border-danger-subtle')}"
                                      th:text="${p.estado.display}">ESTADO</span>
                            </td>
                            <td class="text-end">
                                <div class="btn-group">
                                    <form th:if="${p.estado.name() == 'PENDIENTE'}" th:action="@{/pagos/{id}/pagar(id=${p.id})}" method="post" class="d-inline">
                                        <button type="submit" class="btn btn-sm btn-success bg-opacity-10 text-success border-success-subtle">
                                            <i class="bi bi-check-lg me-1"></i> Registrar Pago
                                        </button>
                                    </form>
                                    <button class="btn btn-sm btn-outline-secondary border-secondary-subtle text-white ms-1">
                                        <i class="bi bi-printer"></i>
                                    </button>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(pagos)}">
                            <td colspan="6" class="text-center py-5 text-muted">
                                <i class="bi bi-cash-stack fs-1 opacity-25"></i>
                                <p class="mt-2">No hay registros de pago.</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
