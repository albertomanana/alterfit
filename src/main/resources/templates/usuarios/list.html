<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: content}">
<head>
    <title>Usuarios</title>
</head>
<body>
    <div th:fragment="content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="h4 fw-bold mb-0">Control de Usuarios</h2>
            <a th:href="@{/usuarios/nuevo}" class="ff-btn ff-btn-primary">
                <i class="bi bi-person-plus me-2"></i> Nuevo Usuario
            </a>
        </div>

        <div class="ff-hud-card">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0" style="color: var(--ff-text);">
                    <thead class="text-muted text-uppercase fw-bold" style="font-size: 0.75rem;">
                        <tr>
                            <th class="border-secondary-subtle">Usuario</th>
                            <th class="border-secondary-subtle">Perfil</th>
                            <th class="border-secondary-subtle">Estatus</th>
                            <th class="border-secondary-subtle">Último Acceso</th>
                            <th class="border-secondary-subtle text-end">Acciones</th>
                        </tr>
                    </thead>
                    <tbody class="border-0">
                        <tr th:each="u : ${usuarios}" class="border-secondary-subtle">
                            <td>
                                <div class="d-flex align-items-center gap-3">
                                    <div class="ff-hud-card p-0 rounded-circle overflow-hidden" style="width: 36px; height: 36px;">
                                        <img th:if="${u.fotoUrl != null}" th:src="${u.fotoUrl}" class="w-100 h-100 object-fit-cover">
                                        <div th:unless="${u.fotoUrl != null}" class="w-100 h-100 d-grid place-items-center bg-secondary bg-opacity-25 text-muted">
                                            <i class="bi bi-person"></i>
                                        </div>
                                    </div>
                                    <div>
                                        <div class="fw-bold" th:text="${u.nombreCompleto}">Nombre Completo</div>
                                        <div class="text-muted small" th:text="${u.email}">email@example.com</div>
                                    </div>
                                </div>
                            </td>
                            <td>
                                <span class="badge bg-secondary bg-opacity-10 text-secondary border border-secondary-subtle" 
                                      th:text="${u.perfil.display}">PERFIL</span>
                            </td>
                            <td>
                                <span th:if="${u.activo}" class="badge bg-success bg-opacity-10 text-success border border-success-subtle">Activo</span>
                                <span th:unless="${u.activo}" class="badge bg-danger bg-opacity-10 text-danger border border-danger-subtle">Inactivo</span>
                            </td>
                            <td class="small text-muted" th:text="${u.ultimoAcceso != null ? #temporals.format(u.ultimoAcceso, 'dd/MM/yyyy HH:mm') : 'Nunca'}">
                                01/01/2026 12:00
                            </td>
                            <td class="text-end">
                                <div class="btn-group">
                                    <a th:href="@{/usuarios/{id}/editar(id=${u.id})}" class="btn btn-sm btn-outline-secondary border-secondary-subtle text-white">
                                        <i class="bi bi-pencil"></i>
                                    </a>
                                    <form th:action="@{/usuarios/{id}/toggle(id=${u.id})}" method="post" class="d-inline">
                                        <button type="submit" class="btn btn-sm btn-outline-secondary border-secondary-subtle text-white">
                                            <i th:class="${u.activo ? 'bi bi-person-x' : 'bi bi-person-check'}"></i>
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(usuarios)}">
                            <td colspan="5" class="text-center py-5 text-muted">
                                <i class="bi bi-inbox fs-1 opacity-25"></i>
                                <p class="mt-2">No hay usuarios registrados.</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
