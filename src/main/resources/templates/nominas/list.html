<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: content}">
<head>
    <title>Nóminas</title>
</head>
<body>
    <div th:fragment="content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="h4 fw-bold mb-0">Control de Nóminas</h2>
                <p class="text-muted small mb-0">Gestión de salarios y pagos al staff.</p>
            </div>
            <a th:href="@{/nominas/nueva}" class="ff-btn ff-btn-primary">
                <i class="bi bi-wallet2 me-2"></i> Nueva Nómina
            </a>
        </div>

        <div class="ff-hud-card">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0" style="color: var(--ff-text);">
                    <thead class="text-muted text-uppercase fw-bold" style="font-size: 0.75rem;">
                        <tr>
                            <th class="border-secondary-subtle">Referencia</th>
                            <th class="border-secondary-subtle">Staff</th>
                            <th class="border-secondary-subtle">Monto Neto</th>
                            <th class="border-secondary-subtle">Fecha</th>
                            <th class="border-secondary-subtle">Estado</th>
                            <th class="border-secondary-subtle text-end">Acciones</th>
                        </tr>
                    </thead>
                    <tbody class="border-0">
                        <tr th:each="n : ${nominas}" class="border-secondary-subtle">
                            <td>
                                <code class="text-primary fw-bold" th:text="${n.referencia}">NOM-000</code>
                            </td>
                            <td>
                                <div class="fw-bold" th:text="${n.staff.usuario.nombreCompleto}">Nombre</div>
                                <div class="text-muted small" th:text="${n.staff.usuario.perfil.display}">PERFIL</div>
                            </td>
                            <td class="fw-bold ff-tabular" th:text="${n.montoNeto + '€'}">0€</td>
                            <td class="small text-muted" th:text="${#temporals.format(n.fechaEmision, 'dd/MM/yyyy')}">01/01/2026</td>
                            <td>
                                <span class="badge bg-opacity-10 border" 
                                      th:classappend="${n.estado == 'EMITIDA' ? 'bg-primary text-primary border-primary-subtle' : (n.estado == 'PAGADA' ? 'bg-success text-success border-success-subtle' : 'bg-warning text-warning border-warning-subtle')}"
                                      th:text="${n.estado}">ESTADO</span>
                            </td>
                            <td class="text-end">
                                <button class="btn btn-sm btn-outline-secondary border-secondary-subtle text-white">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(nominas)}">
                            <td colspan="6" class="text-center py-5 text-muted">
                                <i class="bi bi-file-earmark-person fs-1 opacity-25"></i>
                                <p class="mt-2">No hay nóminas registradas.</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
