<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso | AtlasGym OS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 2.5rem;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .hud-scanline {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.02), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.02));
            background-size: 100% 3px, 3px 100%;
            pointer-events: none;
            z-index: 1000;
            opacity: 0.1;
        }
    </style>
</head>
<body>
    <div class="hud-scanline"></div>
    
    <div class="ff-hud-card login-card">
        <div class="text-center mb-4">
            <h1 class="h2 fw-bold mb-0" style="color: var(--ff-primary); letter-spacing: -1px;">
                ATLAS<span style="color: var(--ff-text);">GYM</span>
            </h1>
            <p class="text-muted text-uppercase fw-bold" style="font-size: 0.7rem; letter-spacing: 2px;">Operations Deck</p>
        </div>

        <div th:if="${error}" class="alert alert-danger border-0 bg-danger bg-opacity-10 text-danger mb-4" style="font-size: 0.85rem;">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <span th:text="${error}">Error de acceso</span>
        </div>

        <form th:action="@{/acceso}" method="post">
            <div class="mb-3">
                <label class="form-label text-muted fw-bold" style="font-size: 0.75rem;">IDENTIFICADOR (EMAIL/USER)</label>
                <input type="text" name="identifier" class="form-control bg-transparent border-secondary-subtle text-white p-3" required autofocus>
            </div>
            <div class="mb-4">
                <label class="form-label text-muted fw-bold" style="font-size: 0.75rem;">CONTRASEÑA</label>
                <input type="password" name="password" class="form-control bg-transparent border-secondary-subtle text-white p-3" required>
            </div>
            <button type="submit" class="ff-btn ff-btn-primary w-100 p-3 text-uppercase fw-bold" style="letter-spacing: 1px;">
                Iniciar Secuencia
            </button>
        </form>

        <div class="mt-4 text-center">
            <small class="text-muted" style="font-size: 0.7rem;">SISTEMA RESTRINGIDO - ACCESO AUTORIZADO SOLAMENTE</small>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
