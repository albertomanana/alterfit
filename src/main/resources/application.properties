# Application Configuration
spring.application.name=AtlasGymOS
spring.profiles.active=local

# Database Configuration (atlasgym_core)
spring.datasource.url=jdbc:mysql://localhost:3306/atlasgym_core?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=atlas_user
spring.datasource.password=atlas_pass_2026
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.sql.init.mode=never

# Auth Settings
app.auth.max-attempts=5
app.auth.lock-minutes=1
app.auth.bootstrap-password=atlas_start_2026

# Server
server.port=8080
server.error.path=/error

# Logging
logging.level.com.atlasgym.os=INFO
logging.level.org.springframework.web=INFO
